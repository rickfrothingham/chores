<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Household</title>
<meta name="theme-color" content="#2b4c7e">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<link rel="icon" href="/icon-512.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Household">
<style>
  :root {
    color-scheme: light dark;   /* native controls (date picker icon, checkboxes) follow light/dark mode */
    --bg: #f3f1ec; --col: #e9e6df; --card: #fff; --ink: #1e2328; --muted: #6b7077;
    --line: #dedad2; --brand: #2b4c7e; --brand-ink: #fff; --warn: #b5442b; --soon: #a86b00; --ok: #2f7d4f;
    --quiet: #8a6d3b; --quiet-bg: #f3ead6;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #121417; --col: #1b1e22; --card: #252a30; --ink: #eceef0; --muted: #9aa0a7;
      --line: #30353b; --brand: #6f9ad6; --brand-ink: #0e1420; --warn: #ef8a71; --soon: #e0b050; --ok: #6cc28f;
      --quiet: #d9b97a; --quiet-bg: #3a3222; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
    font: 16px/1.35 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body { display: flex; flex-direction: column; }
  button { font: inherit; color: inherit; cursor: pointer; border: 0; background: none; border-radius: 10px; }
  button:disabled { opacity: .4; cursor: default; }
  input, select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1.5px solid var(--line);
    border-radius: 10px; padding: 10px 12px; width: 100%; }
  textarea { min-height: 70px; resize: vertical; }
  input[type=date]::-webkit-calendar-picker-indicator { cursor: pointer; opacity: 1; width: 18px; height: 18px; }
  input:focus, select:focus, textarea:focus { outline: 2px solid var(--brand); border-color: transparent; }

  header { padding: max(12px, env(safe-area-inset-top)) 14px 8px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
  .tabs { display: flex; background: var(--col); border-radius: 12px; padding: 3px; margin-right: auto; }
  .tabs button { padding: 7px 14px; font-weight: 600; font-size: 15px; color: var(--muted); border-radius: 9px; }
  .tabs button.on { background: var(--card); color: var(--ink); box-shadow: 0 1px 2px rgba(0,0,0,.08); }
  .hbtn { padding: 8px 12px; background: var(--card); border: 1px solid var(--line); font-size: 15px; }
  .hbtn.primary { background: var(--brand); color: var(--brand-ink); border-color: transparent; font-weight: 600; }
  header { flex-wrap: nowrap; }
  @media (max-width: 520px) { .lbl { display: none; } .tabs button { padding: 7px 10px; } .hbtn { padding: 8px 11px; } }
  @media (max-width: 400px) { header { gap: 5px; padding-left: 10px; padding-right: 10px; } .tabs button { padding: 7px 7px; font-size: 14px; } .hbtn { padding: 8px 9px; } }
  @media (max-width: 350px) { .tabs { padding: 2px; } .tabs button { padding: 6px 5px !important; font-size: 12.5px !important; } .hbtn { padding: 7px 7px !important; } }
  .filters { display: flex; gap: 6px; padding: 0 14px 10px; overflow-x: auto; scrollbar-width: none; flex: none; }
  .filters::-webkit-scrollbar { display: none; }
  .chip { padding: 6px 12px; border-radius: 999px; background: var(--card); border: 1px solid var(--line);
    font-size: 14px; white-space: nowrap; display: inline-flex; align-items: center; gap: 6px; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .sep { flex: none; width: 1px; background: var(--line); margin: 4px 4px; }
  .tag.personal { background: transparent; border: 1px solid var(--line); }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }

  /* boards */
  .board { flex: 1; display: flex; gap: 12px; padding: 0 14px max(14px, env(safe-area-inset-bottom));
    overflow-x: auto; scroll-snap-type: x mandatory; align-items: flex-start; min-height: 0; }
  .column { background: var(--col); border-radius: 16px; padding: 10px; flex: 0 0 86%; max-width: 360px;
    scroll-snap-align: center; display: flex; flex-direction: column; max-height: 100%; }
  @media (min-width: 760px) { .column { flex: 1 1 0; max-width: none; min-width: 200px; } .board { scroll-snap-type: none; } }
  .col-head { display: flex; align-items: center; gap: 8px; padding: 2px 4px 8px; min-height: 38px; }
  .col-head h2 { font-size: 15px; margin: 0; flex: 1; }
  .count { color: var(--muted); font-size: 13px; font-weight: 500; }
  .col-add { font-size: 20px; line-height: 1; padding: 2px 8px; color: var(--muted); }
  .cards { min-height: 60px; display: flex; flex-direction: column; gap: 8px; overflow-y: auto; padding-bottom: 4px; }
  /* Empty-column text is drawn by CSS, not as a real element: a real element inside the
     list makes the drag library treat the column as non-empty and refuse drops. */
  .board .cards:empty::before { content: attr(data-empty); display: block; color: var(--muted); font-size: 14px;
    text-align: center; padding: 14px 0; pointer-events: none; }

  /* cards */
  .card { background: var(--card); border-radius: 12px; padding: 10px 10px 10px 12px; display: flex; gap: 8px;
    align-items: flex-start; box-shadow: 0 1px 2px rgba(0,0,0,.06); user-select: none; cursor: pointer; position: relative; overflow: hidden; }
  .stripes { position: absolute; left: 0; top: 0; bottom: 0; display: flex; }
  .stripes i { width: 4px; }
  .card-body { flex: 1; min-width: 0; }
  .card-title { font-weight: 550; word-wrap: break-word; }
  .card-meta { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 13px; color: var(--muted); margin-top: 4px; align-items: center; }
  .card-meta > span { display: inline-flex; align-items: center; gap: 4px; }
  .due-late { color: var(--warn); font-weight: 600; } .due-soon { color: var(--soon); font-weight: 600; }
  .tag { font-size: 12px; padding: 1px 7px; border-radius: 999px; background: var(--col); color: var(--muted); }
  .tag.quiet { background: var(--quiet-bg); color: var(--quiet); font-weight: 600; }
  .card.stale { opacity: .72; }
  .progress { display: inline-block; width: 36px; height: 5px; border-radius: 3px; background: var(--line); overflow: hidden; vertical-align: middle; }
  .progress i { display: block; height: 100%; background: var(--ok); }
  .check { width: 30px; height: 30px; border-radius: 50%; border: 2px solid var(--line); flex: none; display: grid; place-items: center;
    color: transparent; font-size: 16px; }
  .check:hover { border-color: var(--ok); color: var(--ok); }
  .card.done { opacity: .6; } .card.done .card-title { text-decoration: line-through; }
  .card.done .check { background: var(--ok); border-color: var(--ok); color: #fff; }
  .sortable-ghost { opacity: .3; } .sortable-chosen { box-shadow: 0 6px 18px rgba(0,0,0,.18); }

  /* today */
  .today { flex: 1; overflow-y: auto; padding: 4px 14px max(24px, env(safe-area-inset-bottom)); }
  .today-inner { max-width: 640px; margin: 0 auto; }
  .today h3 { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 8px; display: flex; gap: 8px; }
  .today h3.late { color: var(--warn); }
  .today .cards { overflow: visible; min-height: 0; }
  .all-clear { text-align: center; color: var(--muted); padding: 60px 20px; }
  .all-clear b { display: block; font-size: 20px; color: var(--ink); margin-bottom: 6px; }

  /* sheets */
  .sheet-bg { position: fixed; inset: 0; background: rgba(0,0,0,.4); display: none; align-items: flex-end; justify-content: center; z-index: 20; }
  .sheet-bg.open { display: flex; }
  @media (min-width: 760px) { .sheet-bg { align-items: center; } .sheet { border-radius: 20px !important; } }
  .sheet { width: 100%; max-width: 560px; max-height: 92vh; overflow-y: auto; background: var(--card);
    border-radius: 20px 20px 0 0; padding: 18px 18px max(18px, env(safe-area-inset-bottom)); }
  .sheet-head { display: flex; align-items: center; gap: 8px; margin-bottom: 4px; }
  .sheet-head h3 { margin: 0; font-size: 20px; flex: 1; }
  .x { font-size: 22px; padding: 2px 10px; color: var(--muted); }
  label.f { display: block; font-size: 14px; color: var(--muted); margin: 14px 0 6px; }
  .row { display: flex; gap: 8px; align-items: center; }
  .seg { display: flex; flex-wrap: wrap; gap: 6px; }
  .seg button { padding: 8px 12px; border: 1px solid var(--line); background: var(--bg); font-size: 15px; display: inline-flex; gap: 6px; align-items: center; }
  .seg button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .actions { display: flex; gap: 8px; margin-top: 18px; }
  .btn { padding: 12px 16px; font-weight: 600; }
  .btn.primary { background: var(--brand); color: var(--brand-ink); flex: 1; }
  .btn.small { padding: 9px 14px; }
  .btn.ghost { color: var(--muted); }
  .btn.danger { color: var(--warn); }
  .btn.danger.armed, .icon-btn.armed { background: var(--warn); color: #fff; }
  .err { color: var(--warn); font-size: 14px; margin-top: 10px; min-height: 1em; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 6px; }
  .list { border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .list-item { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-top: 1px solid var(--line); }
  .list-item:first-child { border-top: 0; }
  .list-item .grow { flex: 1; min-width: 0; }
  .small { font-size: 13px; color: var(--muted); }
  .icon-btn { padding: 6px 8px; color: var(--muted); font-size: 15px; }
  .section { margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--line); }
  .section h4 { margin: 0 0 10px; font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); display: flex; gap: 8px; align-items: center; }
  .center { text-align: center; } .loading { margin: 80px auto; color: var(--muted); }
  input[type=color] { width: 36px; height: 32px; padding: 2px; border-radius: 8px; }

  /* archive */
  .show-finished { display: block; width: 100%; margin-top: 8px; padding: 8px; font-size: 14px; color: var(--muted); text-align: center; }
  .show-finished:hover { color: var(--ink); }
  .arch-month { font-size: 13px; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 18px 4px 6px; }
  .arch-item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 12px; border-top: 1px solid var(--line); cursor: pointer; }
  .arch-item:first-child { border-top: 0; }
  .arch-item:hover { background: var(--bg); }
  .arch-item .grow { flex: 1; min-width: 0; }
  .arch-item .t { font-weight: 550; word-wrap: break-word; }
  .readonly-note { white-space: pre-wrap; background: var(--bg); border-radius: 10px; padding: 10px 12px; }

  /* checklist + activity */
  .ck { display: flex; align-items: center; gap: 10px; padding: 8px 4px; border-top: 1px solid var(--line); }
  .ck:first-child { border-top: 0; }
  .ck input[type=checkbox] { width: 22px; height: 22px; flex: none; accent-color: var(--ok); }
  .ck .t { flex: 1; min-width: 0; word-wrap: break-word; }
  .ck.done .t > span { text-decoration: line-through; color: var(--muted); }
  .log { display: flex; flex-direction: column; gap: 10px; margin-top: 12px; }
  .log-note { background: var(--bg); border-radius: 12px; padding: 10px 12px; }
  .log-note .who { font-size: 13px; color: var(--muted); margin-bottom: 3px; }
  .log-event { font-size: 13px; color: var(--muted); padding: 0 4px; }
</style>
</head>
<body>
<div id="root" class="loading center">Loading…</div>
<div class="sheet-bg" id="sheetBg"><div class="sheet" id="sheet"></div></div>

<script src="/Sortable.min.js"></script>
<script>
// ===================== helpers =====================
const $ = (s, r = document) => r.querySelector(s);
const root = $('#root');
let S = null;                                        // state from the server
let tab = lsGet('tab') || 'today';                   // 'today' | 'chore' | 'project'
let filter = lsGet('filter') || 'all';
let scopeFilter = lsGet('scope') || 'all';           // 'all' | 'family' | 'personal'
let dragging = false;
const QUIET_DAYS = 14, STALE_DAYS = 42;              // projects: "quiet" tag, then faded card
const LABEL = { chore: 'Chore/Task', project: 'Project' };
const SCOPE_LABEL = { family: 'Family', personal: 'Personal' };

function lsGet(k) { try { return localStorage.getItem(k); } catch { return null; } }
function lsSet(k, v) { try { localStorage.setItem(k, v); } catch {} }

function el(tag, attrs = {}, ...kids) {
  const e = document.createElement(tag);
  for (const [k, v] of Object.entries(attrs || {})) {
    if (v == null || v === false) continue;
    if (k === 'class') e.className = v;
    else if (k === 'style' && typeof v === 'object') Object.assign(e.style, v);
    else if (k.startsWith('on')) e.addEventListener(k.slice(2), v);
    else if (k === 'value') e.value = v;
    else e.setAttribute(k, v === true ? '' : v);
  }
  for (const k of kids.flat(Infinity)) if (k != null && k !== false) e.append(k.nodeType ? k : String(k));
  return e;
}
// Who is using this phone (a person id). Stored on the phone only and sent with
// every request; it drives "Mine" and the names in the history. Storage can be
// unavailable (private browsing), so fall back to memory for this visit.
let whoMemory = '';
function getWho() { try { return localStorage.getItem('who_id') || whoMemory; } catch { return whoMemory; } }
function setWho(id) { whoMemory = String(id || ''); try { id ? localStorage.setItem('who_id', String(id)) : localStorage.removeItem('who_id'); } catch {} }

// Paths are relative ('api/state'), so they stay inside the secret /k/<key>/ address.
async function api(method, path, body) {
  const headers = { 'x-who-id': getWho() };
  if (body) headers['content-type'] = 'application/json';
  const res = await fetch(path, { method, headers, body: body ? JSON.stringify(body) : undefined });
  let data = {}; try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.message || data.error || 'Error ' + res.status);
  return data;
}
const person = (id) => S.people.find((p) => p.id === id);
// Owners of a card or recurring template, in Settings order.
const ownersOf = (x) => (x.person_ids || []).map(person).filter(Boolean);
const colsOf = (cat) => S.columns.filter((c) => c.category === cat);
const colName = (id) => (S.columns.find((c) => c.id === id) || {}).name || '';
const isDone = (t) => t.column_id === S.done_column_ids[t.category];
// Name shown in the history. New entries store the person's name; entries from
// the old email login stored an address, which is mapped back to a name.
function whoName(by) {
  if (by === 'automatic') return 'Automatic';
  if (!by) return 'Someone';
  if (!by.includes('@')) return by;
  const p = S.people.find((x) => x.email === by);
  return p ? p.name : by.split('@')[0];
}

// ---- dates ----
const DAY = 86400000;
const localYmd = (d) => d.toLocaleDateString('en-CA');
const daysBetween = (a, b) => Math.round((Date.parse(b) - Date.parse(a)) / DAY);   // b - a, YYYY-MM-DD
const shortDate = (ymd) => new Date(ymd + 'T12:00').toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
const plural = (n, w) => n + ' ' + w + (n === 1 ? '' : 's');

// Relative due label + color class. Color only kicks in within 3 days.
function dueInfo(ymd) {
  const n = daysBetween(S.today, ymd);
  if (n < 0) return { text: plural(-n, 'day') + ' late', cls: 'due-late', n };
  if (n === 0) return { text: 'Due today', cls: 'due-soon', n };
  if (n === 1) return { text: 'Due tomorrow', cls: 'due-soon', n };
  if (n <= 3) return { text: 'Due in ' + n + ' days', cls: 'due-soon', n };
  if (n < 14) return { text: 'Due in ' + n + ' days', cls: '', n };
  if (n < 60) return { text: 'Due in ' + Math.round(n / 7) + ' wks', cls: '', n };
  return { text: 'Due in ' + Math.round(n / 30) + ' mo', cls: '', n };
}
// Days since anyone touched a project.
function quietDays(t) {
  if (t.category !== 'project' || isDone(t) || !t.last_activity_at) return 0;
  return daysBetween(localYmd(new Date(t.last_activity_at)), S.today);
}
function when(iso) {
  const d = new Date(iso), ymd = localYmd(d), n = daysBetween(ymd, S.today);
  const time = d.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
  if (n === 0) return 'Today ' + time;
  if (n === 1) return 'Yesterday ' + time;
  return d.toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: n > 300 ? 'numeric' : undefined });
}

// Two-tap confirm for destructive buttons.
function confirmBtn(label, onConfirm, cls = 'btn danger') {
  const b = el('button', { class: cls, type: 'button' }, label);
  let armed = false, t;
  b.addEventListener('click', async (e) => {
    e.stopPropagation();
    if (!armed) { armed = true; b.textContent = label.length > 2 ? 'Tap again to confirm' : 'Sure?'; b.classList.add('armed');
      t = setTimeout(() => { armed = false; b.textContent = label; b.classList.remove('armed'); }, 3000); return; }
    clearTimeout(t); b.disabled = true;
    try { await onConfirm(); } catch (x) { toast(x.message); }
  });
  return b;
}
function toast(msg) {
  const d = el('div', { style: { position: 'fixed', left: '50%', bottom: '24px', transform: 'translateX(-50%)', background: 'var(--ink)',
    color: 'var(--bg)', padding: '10px 16px', borderRadius: '12px', zIndex: 40, fontSize: '14px' } }, msg);
  document.body.append(d); setTimeout(() => d.remove(), 3500);
}

// ===================== load =====================
async function load() {
  try {
    S = await api('GET', 'api/state');
    if (!S.setup_done) renderSetup();
    else if (!S.me.person_id) renderWho();      // first visit on this phone, or that person was removed
    else render();
  } catch (e) {
    root.className = 'center'; root.style.display = '';
    root.replaceChildren(el('div', { class: 'loading' }, e.message, el('br'), el('br'), el('button', { class: 'hbtn primary', onclick: load }, 'Try again')));
  }
}

// ===================== setup =====================
function renderSetup() {
  root.className = ''; root.style.display = '';
  const err = el('div', { class: 'err' });
  const inputs = [el('input', { placeholder: 'Your name', maxlength: 30 }), el('input', { placeholder: 'e.g. your partner', maxlength: 30 }),
    el('input', { value: 'Charlotte', maxlength: 30 }), el('input', { placeholder: '(optional)', maxlength: 30 })];
  const form = el('form', { class: 'sheet', style: { margin: '24px auto', borderRadius: '20px' } },
    el('h3', {}, 'Set up the household board'),
    el('div', { class: 'hint' }, 'Who can chores and projects be assigned to? You can change this later in Settings.'),
    el('label', { class: 'f' }, 'You'), inputs[0],
    el('label', { class: 'f' }, 'Everyone else'), inputs[1], el('div', { style: { height: '8px' } }), inputs[2],
    el('div', { style: { height: '8px' } }), inputs[3],
    err, el('div', { class: 'actions' }, el('button', { class: 'btn primary', type: 'submit' }, 'Create board')));
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    if (!inputs[0].value.trim()) { err.textContent = 'Enter your name.'; return; }
    try {
      await api('POST', 'api/setup', { people: inputs.map((i) => ({ name: i.value })) });
      await refresh();
      setWho(S.people[0].id);                 // whoever set it up is the first name
      load();
    }
    catch (x) { err.textContent = x.message; }
  });
  root.replaceChildren(form);
}

// ===================== who's using this phone =====================
// Asked once per phone (and once more inside an iPhone home-screen app, which
// keeps its own storage). Not security: anyone with the link is trusted.
function renderWho() {
  root.className = ''; root.style.display = '';
  root.replaceChildren(el('div', { class: 'sheet', style: { margin: '24px auto', borderRadius: '20px' } },
    el('h3', {}, 'Who’s using this phone?'),
    el('div', { class: 'hint' }, 'Used for the “Mine” filter and to show who made changes. You can change it later in Settings.'),
    el('div', { class: 'seg', style: { marginTop: '16px' } }, S.people.map((p) => el('button', { type: 'button', style: { padding: '12px 18px', fontSize: '17px' },
      onclick: () => { setWho(p.id); load(); } }, el('span', { class: 'dot', style: { background: p.color } }), p.name)))));
}

// ===================== main layout =====================
function visible(t) {
  if (scopeFilter !== 'all' && t.scope !== scopeFilter) return false;
  if (filter === 'all') return true;
  const ids = t.person_ids || [];
  if (filter === 'mine') return S.me.person_id != null && ids.includes(S.me.person_id);
  if (filter === 'none') return ids.length === 0;
  return ids.includes(+filter);
}

function render() {
  root.className = ''; root.style.display = 'contents';
  if (!['all', 'mine', 'none'].includes(filter) && !person(+filter)) filter = 'all';
  if (filter === 'mine' && !S.me.person_id) filter = 'all';

  const tabBtn = (key, label) => el('button', { class: tab === key ? 'on' : '', onclick: () => { tab = key; lsSet('tab', key); render(); } }, label);
  const addCat = tab === 'project' ? 'project' : 'chore';
  const header = el('header', {},
    el('div', { class: 'tabs', role: 'tablist' }, tabBtn('today', 'Today'), tabBtn('chore', 'Chores/Tasks'), tabBtn('project', 'Projects')),
    tab === 'chore' ? el('button', { class: 'hbtn', onclick: openRecurringList, title: 'Recurring chores/tasks', 'aria-label': 'Recurring chores/tasks' }, '↻', el('span', { class: 'lbl' }, ' Recurring')) : null,
    el('button', { class: 'hbtn', onclick: openSettings, 'aria-label': 'Settings' }, '⚙︎'),
    el('button', { class: 'hbtn primary', onclick: () => openNew(addCat, null), 'aria-label': 'Add' }, '+', el('span', { class: 'lbl' }, tab === 'project' ? ' Project' : tab === 'chore' ? ' Chore/Task' : ' Add')));

  const chip = (key, label, color) => el('button', { class: 'chip' + (filter === key ? ' on' : ''),
    onclick: () => { filter = key; lsSet('filter', key); render(); } },
    color ? el('span', { class: 'dot', style: { background: color } }) : null, label);
  const scopeChip = (key, label) => el('button', { class: 'chip' + (scopeFilter === key ? ' on' : ''),
    onclick: () => { scopeFilter = key; lsSet('scope', key); render(); } }, label);
  const filters = el('div', { class: 'filters' },
    scopeChip('all', 'All'), scopeChip('family', 'Family'), scopeChip('personal', 'Personal'),
    el('span', { class: 'sep', 'aria-hidden': 'true' }),
    chip('all', 'Everyone'),
    S.me.person_id ? chip('mine', 'Mine') : null,
    S.people.map((p) => chip(String(p.id), p.name, p.color)), chip('none', 'Unassigned'));

  root.replaceChildren(header, filters, tab === 'today' ? renderToday() : renderBoard(tab));
}

// ===================== cards =====================
function cardEl(t, opts = {}) {
  const done = isDone(t);
  const owners = ownersOf(t);
  const q = quietDays(t);
  const meta = [];
  if (opts.showCategory) meta.push(el('span', { class: 'tag' }, LABEL[t.category] + ' · ' + colName(t.column_id)));
  // Up to two owners by name; beyond that, the first name plus a count.
  const ownerDot = (o) => el('span', {}, el('span', { class: 'dot', style: { background: o.color } }), o.name);
  if (owners.length && owners.length <= 2) owners.forEach((o) => meta.push(ownerDot(o)));
  else if (owners.length > 2) meta.push(el('span', { title: owners.map((o) => o.name).join(', ') },
    el('span', { class: 'dot', style: { background: owners[0].color } }), owners[0].name + ' +' + (owners.length - 1)));
  if (t.scope === 'personal') meta.push(el('span', { class: 'tag personal', title: 'Personal' }, 'Personal'));
  if (t.due_date && !done) { const d = dueInfo(t.due_date); meta.push(el('span', { class: d.cls, title: shortDate(t.due_date) }, d.text)); }
  if (t.checklist_total) {
    const pct = Math.round((100 * t.checklist_done) / t.checklist_total);
    meta.push(el('span', { title: 'Checklist' }, el('span', { class: 'progress' }, el('i', { style: { width: pct + '%' } })), t.checklist_done + '/' + t.checklist_total));
  }
  if (q >= QUIET_DAYS) meta.push(el('span', { class: 'tag quiet', title: 'No activity for ' + plural(q, 'day') }, 'Quiet ' + Math.floor(q / 7) + ' wks'));
  if (t.recurrence_id) meta.push(el('span', { title: 'Recurring' }, '↻'));
  if (t.notes && t.category === 'chore') meta.push(el('span', { title: 'Has notes' }, '✎'));

  const check = el('button', { class: 'check', 'aria-label': done ? 'Mark not done' : 'Mark done' }, '✓');
  check.addEventListener('click', async (e) => {
    e.stopPropagation(); check.disabled = true;
    const target = done ? colsOf(t.category)[0].id : S.done_column_ids[t.category];
    try { await api('PATCH', 'api/tasks/' + t.id, { column_id: target }); } catch (x) { toast(x.message); }
    load();
  });
  return el('div', { class: 'card' + (done ? ' done' : '') + (q >= STALE_DAYS ? ' stale' : ''), 'data-id': t.id,
    style: { paddingLeft: 12 + 4 * owners.length + 'px' }, onclick: () => { if (!dragging) openCard(t); } },
    owners.length ? el('div', { class: 'stripes', 'aria-hidden': 'true' }, owners.map((o) => el('i', { style: { background: o.color } }))) : null,
    el('div', { class: 'card-body' }, el('div', { class: 'card-title' }, t.title), meta.length ? el('div', { class: 'card-meta' }, meta) : null),
    check);
}

// ===================== board (chores or projects) =====================
function renderBoard(cat) {
  const board = el('div', { class: 'board' });
  const doneId = S.done_column_ids[cat];
  for (const col of colsOf(cat)) {
    const isDoneCol = col.id === doneId;
    const tasks = S.tasks.filter((t) => t.column_id === col.id && visible(t));
    if (isDoneCol) tasks.sort((a, b) => (b.done_at || '').localeCompare(a.done_at || ''));
    const list = el('div', { class: 'cards', 'data-col': col.id, 'data-empty': isDoneCol ? 'Nothing finished recently' : 'Nothing here' },
      tasks.map((t) => cardEl(t)));
    board.append(el('section', { class: 'column' },
      el('div', { class: 'col-head' }, el('h2', {}, col.name, ' ', el('span', { class: 'count' }, tasks.length || '')),
        isDoneCol ? null : el('button', { class: 'col-add', 'aria-label': 'Add to ' + col.name, onclick: () => openNew(cat, col.id) }, '+')),
      list,
      isDoneCol ? el('button', { class: 'show-finished', type: 'button', onclick: () => openArchive({ category: cat, kind: 'finished' }) }, 'Show all finished →') : null));
    Sortable.create(list, {
      group: 'cards-' + cat, animation: 150, delay: 180, delayOnTouchOnly: true, filter: '.check',
      preventOnFilter: false, sort: !isDoneCol,
      onStart: () => { dragging = true; }, onEnd: onDrop,
    });
  }
  return board;
}

async function onDrop(evt) {
  setTimeout(() => { dragging = false; }, 50);
  const card = evt.item, id = +card.dataset.id, colId = +evt.to.dataset.col;
  const t = S.tasks.find((x) => x.id === id);
  if (!t || (colId === t.column_id && evt.oldIndex === evt.newIndex)) return;
  const posOf = (node) => { const x = node && node.dataset && S.tasks.find((y) => y.id === +node.dataset.id); return x ? x.position : null; };
  const prev = posOf(card.previousElementSibling), next = posOf(card.nextElementSibling);
  const position = prev != null && next != null ? (prev + next) / 2 : prev != null ? prev + 1 : next != null ? next - 1 : 1;
  try { await api('PATCH', 'api/tasks/' + id, { column_id: colId, position }); } catch (x) { toast(x.message); }
  load();
}

// ===================== today =====================
function renderToday() {
  const open = S.tasks.filter((t) => !isDone(t) && visible(t));
  const used = new Set();
  const take = (arr) => { arr.forEach((t) => used.add(t.id)); return arr; };
  const withDue = open.filter((t) => t.due_date).sort((a, b) => a.due_date.localeCompare(b.due_date));
  const late = take(withDue.filter((t) => daysBetween(S.today, t.due_date) < 0));
  const week = take(withDue.filter((t) => { const n = daysBetween(S.today, t.due_date); return n >= 0 && n <= 6; }));
  const quiet = take(open.filter((t) => !used.has(t.id) && quietDays(t) >= QUIET_DAYS).sort((a, b) => quietDays(b) - quietDays(a)));
  const soon = take(withDue.filter((t) => !used.has(t.id) && daysBetween(S.today, t.due_date) <= 30));
  const doing = open.filter((t) => !used.has(t.id) && t.category === 'project' && colsOf('project').findIndex((c) => c.id === t.column_id) >= 2);

  const section = (title, items, cls, hint) => items.length ? [
    el('h3', { class: cls || '' }, title, el('span', { style: { fontWeight: 500 } }, items.length)),
    hint ? el('div', { class: 'hint', style: { margin: '-4px 4px 8px' } }, hint) : null,
    el('div', { class: 'cards' }, items.map((t) => cardEl(t, { showCategory: true }))),
  ] : null;

  const parts = [
    section('Overdue', late, 'late'),
    section('Due this week', week),
    section('Gone quiet', quiet, '', 'Projects nobody has touched in 2+ weeks. Add a note or tick a step to clear this.'),
    section('Coming up (next 30 days)', soon),
    section('Projects in progress', doing),
  ].filter(Boolean);
  const inner = el('div', { class: 'today-inner' }, parts.length ? parts :
    el('div', { class: 'all-clear' }, el('b', {}, 'Nothing urgent'), 'No overdue items, nothing due this week, and no projects gone quiet.'));
  return el('div', { class: 'today' }, inner);
}

// ===================== archive (finished & deleted) =====================
// Lists cards that have left the board, newest first, grouped by month. The
// board's filters (Family/Personal and people) apply here too.
let archiveOpts = { category: 'chore', kind: 'finished', q: '' };
let archiveTimer = null;

function openArchive(opts) {
  archiveOpts = { ...archiveOpts, ...opts };
  const o = archiveOpts;
  const listWrap = el('div', {}, el('div', { class: 'hint center', style: { padding: '20px' } }, 'Loading…'));
  const seg = (items, cur, key) => el('div', { class: 'seg' }, items.map(([v, label]) => el('button', { type: 'button', class: cur === v ? 'on' : '',
    onclick: () => openArchive({ [key]: v }) }, label)));
  const search = el('input', { type: 'search', placeholder: 'Search titles and notes…', value: o.q, maxlength: 100 });
  search.addEventListener('input', () => {
    clearTimeout(archiveTimer);
    archiveTimer = setTimeout(() => { archiveOpts.q = search.value; fillArchive(listWrap); }, 300);
  });
  const filtered = scopeFilter !== 'all' || filter !== 'all';
  openSheet(
    head(o.kind === 'deleted' ? 'Deleted items' : 'Finished items'),
    el('div', { class: 'row', style: { flexWrap: 'wrap', gap: '8px', marginTop: '6px' } },
      seg([['chore', 'Chores/Tasks'], ['project', 'Projects']], o.category, 'category'),
      seg([['finished', 'Finished'], ['deleted', 'Deleted']], o.kind, 'kind')),
    el('div', { style: { marginTop: '10px' } }, search),
    filtered ? el('div', { class: 'hint' }, 'Filtered like the board: ' + filterLabel() + '. ',
      el('button', { class: 'icon-btn', style: { padding: 0, textDecoration: 'underline' }, onclick: () => {
        scopeFilter = 'all'; filter = 'all'; lsSet('scope', 'all'); lsSet('filter', 'all'); openArchive({}); } }, 'Show everyone')) : null,
    listWrap);
  fillArchive(listWrap);
}

function filterLabel() {
  const parts = [];
  if (scopeFilter !== 'all') parts.push(SCOPE_LABEL[scopeFilter]);
  if (filter === 'mine') parts.push('Mine');
  else if (filter === 'none') parts.push('Unassigned');
  else if (filter !== 'all' && person(+filter)) parts.push(person(+filter).name);
  return parts.join(' · ');
}

async function fillArchive(listWrap) {
  const o = archiveOpts;
  let data;
  try {
    data = await api('GET', 'api/archive?category=' + o.category + '&kind=' + o.kind + '&q=' + encodeURIComponent(o.q || ''));
  } catch (x) { listWrap.replaceChildren(el('div', { class: 'err' }, x.message)); return; }
  if (o !== archiveOpts || data.category !== archiveOpts.category || data.kind !== archiveOpts.kind) return; // a newer view replaced this one
  const items = data.items.filter(visible);
  if (!items.length) {
    listWrap.replaceChildren(el('div', { class: 'hint center', style: { padding: '30px 10px' } },
      o.q ? 'Nothing matches “' + o.q + '”.' : o.kind === 'deleted' ? 'Nothing has been deleted.' : 'Nothing finished yet.'));
    return;
  }
  const verb = o.kind === 'deleted' ? 'Deleted' : 'Finished';
  const groups = [];
  for (const t of items) {
    const label = new Date(t.ended_at).toLocaleDateString('en-US', { month: 'long', year: 'numeric' });
    if (!groups.length || groups[groups.length - 1].label !== label) groups.push({ label, items: [] });
    groups[groups.length - 1].items.push(t);
  }
  listWrap.replaceChildren(...groups.flatMap((g) => [
    el('div', { class: 'arch-month' }, g.label),
    el('div', { class: 'list' }, g.items.map((t) => {
      const owners = ownersOf(t);
      const meta = [verb + ' ' + when(t.ended_at)];
      if (owners.length) meta.push(owners.map((x) => x.name).join(', '));
      if (t.scope === 'personal') meta.push('Personal');
      if (t.checklist_total) meta.push('Checklist ' + t.checklist_done + '/' + t.checklist_total);
      if (t.recurrence_id) meta.push('↻ Recurring');
      return el('div', { class: 'arch-item', onclick: () => openArchived(t.id) },
        el('div', { class: 'grow' }, el('div', { class: 't' }, t.title), el('div', { class: 'small' }, meta.join(' · '))),
        el('span', { class: 'small' }, '›'));
    })),
  ]), ...(data.truncated ? [el('div', { class: 'hint center' }, 'Showing the most recent 500. Search to find older items.')] : []));
}

// Read-only view of a finished or deleted card, with Restore.
async function openArchived(id) {
  let d;
  try { d = await api('GET', 'api/tasks/' + id); } catch (x) { toast(x.message); return; }
  const t = d.task;
  const owners = (t.person_ids || []).map(person).filter(Boolean);
  const status = t.deleted_at ? 'Deleted ' + when(t.deleted_at) : 'Finished ' + when(t.done_at || t.archived_at || t.updated_at);
  const row = (label, value) => value ? [el('label', { class: 'f' }, label), el('div', {}, value)] : null;
  const back = () => openArchive({});
  openSheet(
    el('div', { class: 'sheet-head' },
      el('button', { class: 'x', type: 'button', 'aria-label': 'Back', onclick: back, style: { fontSize: '18px' } }, '‹'),
      el('h3', {}, t.title),
      el('button', { class: 'x', type: 'button', 'aria-label': 'Close', onclick: closeSheet }, '×')),
    el('div', { class: 'hint' }, LABEL[t.category] + ' · ' + status),
    row('Who', owners.length ? el('div', { class: 'card-meta', style: { marginTop: 0, fontSize: '15px', color: 'var(--ink)' } },
      owners.map((o) => el('span', {}, el('span', { class: 'dot', style: { background: o.color } }), o.name))) : 'Nobody'),
    row('For', SCOPE_LABEL[t.scope] || 'Family'),
    row('Due date', t.due_date ? shortDate(t.due_date) + ', ' + t.due_date.slice(0, 4) : null),
    row(t.category === 'project' ? 'Description' : 'Notes', t.notes ? el('div', { class: 'readonly-note' }, t.notes) : null),
    d.checklist.length ? el('div', { class: 'section' }, el('h4', {}, 'Checklist', el('span', { style: { fontWeight: 500 } },
      d.checklist.filter((i) => i.done_at).length + ' of ' + d.checklist.length)),
      d.checklist.map((i) => el('div', { class: 'ck' + (i.done_at ? ' done' : '') },
        el('span', { style: { width: '22px', textAlign: 'center' } }, i.done_at ? '☑' : '☐'),
        el('div', { class: 't' }, el('span', {}, i.text))))) : null,
    d.activity.length ? el('div', { class: 'section' }, el('h4', {}, t.category === 'project' ? 'Updates & history' : 'History'),
      el('div', { class: 'log', style: { marginTop: 0 } }, d.activity.map((a) => a.kind === 'note'
        ? el('div', { class: 'log-note' }, el('div', { class: 'who' }, whoName(a.by) + ' · ' + when(a.at)), el('div', { style: { whiteSpace: 'pre-wrap' } }, a.text))
        : el('div', { class: 'log-event' }, a.text + ' · ' + whoName(a.by) + ' · ' + when(a.at))))) : null,
    el('div', { class: 'actions' },
      el('button', { class: 'btn ghost', type: 'button', onclick: back }, 'Back'),
      el('button', { class: 'btn primary', type: 'button', onclick: async (e) => {
        e.target.disabled = true;
        try {
          const r = await api('POST', 'api/tasks/' + id + '/restore');
          await refresh();
          toast('Restored to ' + colName(r.column_id));
          back();
        } catch (x) { toast(x.message); e.target.disabled = false; }
      } }, 'Restore to board')));
}

// ===================== recurring chores =====================
function openRecurringList() {
  const items = S.recurrences.map((r) => {
    const names = ownersOf(r).map((o) => o.name).join(', ');
    const whenTxt = r.paused ? 'Paused' : r.next_date ? 'Next card: ' + shortDate(r.next_date) : 'Next card after the current one is done';
    return el('div', { class: 'list-item', style: { cursor: 'pointer' }, onclick: () => openRecurring(r) },
      el('div', { class: 'grow' }, el('div', {}, r.title),
        el('div', { class: 'small' }, r.description + (names ? ' · ' + names : '') + (r.scope === 'personal' ? ' · Personal' : ''), el('br'), whenTxt)),
      el('span', { class: 'small' }, '›'));
  });
  openSheet(head('Recurring chores/tasks'),
    el('div', { class: 'hint' }, 'Each one adds a card to “' + colsOf('chore')[0].name + '” when it comes due. If the last card is still open, no duplicate is added.'),
    el('div', { style: { height: '12px' } }),
    items.length ? el('div', { class: 'list' }, items) : el('div', { class: 'hint center' }, 'None yet.'),
    el('div', { class: 'actions' }, el('button', { class: 'btn primary', onclick: () => openRecurring(null) }, '+ New recurring chore/task')));
}

function openRecurring(r) {
  const isNew = !r;
  const f = r ? { ...r, weekdays: [...r.weekdays], person_ids: [...(r.person_ids || [])] } : { title: '', notes: '', person_ids: defaultPeople(), scope: defaultScope(), mode: 'schedule', freq: 'weekly', every: 1,
    weekdays: [new Date(S.today + 'T12:00').getDay()], month_day: +S.today.slice(8, 10), interval_days: 30 };
  const startDefault = r ? (r.mode === 'schedule' ? r.anchor : (r.next_date || S.today)) : S.today;
  const err = el('div', { class: 'err' });
  const title = el('input', { value: f.title, maxlength: 120, placeholder: 'e.g. Water the plants' });
  const notes = el('textarea', { maxlength: 1000, placeholder: 'Details (optional)' }); notes.value = f.notes || '';
  const start = el('input', { type: 'date', value: startDefault });
  const every = el('input', { type: 'number', min: 1, max: 52, value: f.every || 1, style: { width: '80px' }, inputmode: 'numeric' });
  const interval = el('input', { type: 'number', min: 1, max: 3650, value: f.interval_days || 30, style: { width: '100px' }, inputmode: 'numeric' });
  const monthDay = el('select', { style: { width: '100px' } }, Array.from({ length: 31 }, (_, i) => el('option', { value: i + 1 }, String(i + 1))));
  monthDay.value = f.month_day || 1;

  const modeSeg = el('div', { class: 'seg' }), freqSeg = el('div', { class: 'seg' }), wdSeg = el('div', { class: 'seg' }), detail = el('div');
  const WD = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const unit = { daily: 'day(s)', weekly: 'week(s)', monthly: 'month(s)' };
  function draw() {
    modeSeg.replaceChildren(
      el('button', { type: 'button', class: f.mode === 'schedule' ? 'on' : '', onclick: () => { f.mode = 'schedule'; draw(); } }, 'On a schedule'),
      el('button', { type: 'button', class: f.mode === 'after_done' ? 'on' : '', onclick: () => { f.mode = 'after_done'; draw(); } }, 'Some days after it’s done'));
    if (f.mode === 'after_done') {
      detail.replaceChildren(
        el('label', { class: 'f' }, 'Reappears'), el('div', { class: 'row' }, interval, el('span', {}, 'days after it’s marked done')),
        el('label', { class: 'f' }, 'First card appears on'), start,
        el('div', { class: 'hint' }, 'Good for things like “change the furnace filter”: the clock restarts whenever it’s actually done.'));
      return;
    }
    freqSeg.replaceChildren(...['daily', 'weekly', 'monthly'].map((k) => el('button', { type: 'button', class: f.freq === k ? 'on' : '',
      onclick: () => { f.freq = k; draw(); } }, k[0].toUpperCase() + k.slice(1))));
    wdSeg.replaceChildren(...WD.map((d, i) => el('button', { type: 'button', class: f.weekdays.includes(i) ? 'on' : '',
      onclick: () => { f.weekdays = f.weekdays.includes(i) ? f.weekdays.filter((x) => x !== i) : [...f.weekdays, i]; draw(); } }, d)));
    detail.replaceChildren(...[
      el('label', { class: 'f' }, 'How often'), freqSeg,
      el('label', { class: 'f' }, 'Every'), el('div', { class: 'row' }, every, el('span', {}, unit[f.freq])),
      f.freq === 'weekly' ? [el('label', { class: 'f' }, 'On'), wdSeg] : null,
      f.freq === 'monthly' ? [el('label', { class: 'f' }, 'On day'), monthDay,
        el('div', { class: 'hint' }, 'Days 29–31 fall on the last day in shorter months.')] : null,
      el('label', { class: 'f' }, 'Starting'), start].flat().filter(Boolean));
  }
  draw();

  const form = el('form', {},
    head(isNew ? 'New recurring chore/task' : 'Edit recurring chore/task'),
    el('label', { class: 'f' }, 'Chore/task'), title,
    el('label', { class: 'f' }, 'Who'), personPicker(f.person_ids, (ids) => { f.person_ids = ids; }),
    el('label', { class: 'f' }, 'For'), scopePicker(f.scope || 'family', (v) => { f.scope = v; }),
    el('label', { class: 'f' }, 'Repeats'), modeSeg, detail,
    el('label', { class: 'f' }, 'Notes'), notes,
    isNew ? null : el('div', { class: 'hint' }, 'Saving restarts the schedule from the “Starting” date. Cards already on the board aren’t changed.'),
    err,
    el('div', { class: 'actions' },
      isNew ? null : confirmBtn('Delete', async () => { await api('DELETE', 'api/recurrences/' + r.id); await refresh(); openRecurringList(); }),
      isNew ? null : el('button', { type: 'button', class: 'btn ghost', onclick: async () => { await api('PATCH', 'api/recurrences/' + r.id, { paused: !r.paused }); await refresh(); openRecurringList(); } }, r.paused ? 'Resume' : 'Pause'),
      el('button', { type: 'button', class: 'btn ghost', onclick: openRecurringList }, 'Back'),
      el('button', { type: 'submit', class: 'btn primary' }, 'Save')));
  form.addEventListener('submit', async (e) => {
    e.preventDefault(); err.textContent = '';
    const body = { title: title.value, notes: notes.value, person_ids: f.person_ids, scope: f.scope || 'family', mode: f.mode, freq: f.freq, every: every.value,
      weekdays: f.weekdays, month_day: monthDay.value, interval_days: interval.value, start_date: start.value };
    try { isNew ? await api('POST', 'api/recurrences', body) : await api('PATCH', 'api/recurrences/' + r.id, body); await refresh(); openRecurringList(); }
    catch (x) { err.textContent = x.message; }
  });
  openSheet(form);
}

// ===================== settings =====================
function openSettings() {
  const err = el('div', { class: 'err' });
  const run = async (fn) => { err.textContent = ''; try { await fn(); await refresh(); openSettings(); } catch (x) { err.textContent = x.message; } };

  const columnsEditor = (cat) => {
    const cols = colsOf(cat), doneId = S.done_column_ids[cat];
    const rows = cols.map((c, i) => {
      const name = el('input', { value: c.name, maxlength: 30 });
      name.addEventListener('change', () => run(() => api('PATCH', 'api/columns/' + c.id, { name: name.value })));
      const move = (d) => run(() => { const ids = cols.map((x) => x.id); [ids[i], ids[i + d]] = [ids[i + d], ids[i]]; return api('PUT', 'api/columns/order', { category: cat, ids }); });
      return el('div', { class: 'list-item' },
        el('div', { class: 'grow' }, name, c.id === doneId ? el('div', { class: 'small', style: { marginTop: '4px' } }, 'Last column = Done') : null),
        el('button', { class: 'icon-btn', disabled: i === 0, onclick: () => move(-1), 'aria-label': 'Move earlier' }, '↑'),
        el('button', { class: 'icon-btn', disabled: i === cols.length - 1, onclick: () => move(1), 'aria-label': 'Move later' }, '↓'),
        c.id === doneId ? null : confirmBtn('✕', () => run(() => api('DELETE', 'api/columns/' + c.id)), 'icon-btn'));
    });
    const newCol = el('input', { placeholder: 'New column name', maxlength: 30 });
    return el('div', { class: 'section' }, el('h4', {}, LABEL[cat] + ' columns'), el('div', { class: 'list' }, rows),
      el('div', { class: 'row', style: { marginTop: '8px' } }, newCol,
        el('button', { class: 'hbtn', onclick: () => newCol.value.trim() && run(() => api('POST', 'api/columns', { name: newCol.value, category: cat })) }, 'Add')),
      el('div', { class: 'hint' }, 'Cards in the last column count as done and leave the board after ' + (cat === 'chore' ? '7' : '30') + ' days.'));
  };

  const people = S.people.map((p) => {
    const name = el('input', { value: p.name, maxlength: 30 });
    name.addEventListener('change', () => run(() => api('PATCH', 'api/people/' + p.id, { name: name.value })));
    const color = el('input', { type: 'color', value: p.color });
    color.addEventListener('change', () => run(() => api('PATCH', 'api/people/' + p.id, { color: color.value })));
    const isMe = p.id === S.me.person_id;
    return el('div', { class: 'list-item' }, color, el('div', { class: 'grow' }, name,
        isMe ? el('div', { class: 'small', style: { marginTop: '4px' } }, 'Using this phone') : null),
      confirmBtn('✕', () => run(() => api('DELETE', 'api/people/' + p.id)), 'icon-btn'));
  });
  const newPerson = el('input', { placeholder: 'Add a person', maxlength: 30 });

  openSheet(
    head('Settings'),
    el('div', { class: 'section', style: { borderTop: 0, marginTop: '8px', paddingTop: 0 } }, el('h4', {}, 'People'), el('div', { class: 'list' }, people),
      el('div', { class: 'row', style: { marginTop: '8px' } }, newPerson,
        el('button', { class: 'hbtn', onclick: () => newPerson.value.trim() && run(() => api('POST', 'api/people', { name: newPerson.value })) }, 'Add')),
    ),
    columnsEditor('chore'),
    columnsEditor('project'),
    el('div', { class: 'section' }, el('h4', {}, 'Finished & deleted'),
      el('div', { class: 'hint', style: { marginTop: 0, marginBottom: '10px' } }, 'Nothing is ever erased. Finished and deleted items can be looked up and restored here.'),
      el('div', { class: 'row' },
        el('button', { class: 'hbtn', onclick: () => openArchive({ category: tab === 'project' ? 'project' : 'chore', kind: 'finished' }) }, 'Finished items'),
        el('button', { class: 'hbtn', onclick: () => openArchive({ category: tab === 'project' ? 'project' : 'chore', kind: 'deleted' }) }, 'Deleted items'))),
    err,
    el('div', { class: 'hint', style: { marginTop: '18px' } }, 'This phone is set to ' + (S.me.name || 'nobody') + ' · ',
      el('button', { class: 'icon-btn', style: { padding: 0, textDecoration: 'underline' }, onclick: () => { setWho(''); closeSheetQuiet(); renderWho(); } }, 'Change')));
}

// ===================== keep in sync =====================
// Reload when the app returns to the foreground, and every 30s while visible,
// so changes from the other phone show up. Skipped while a sheet is open or dragging.
const idle = () => !document.hidden && !sheetBg.classList.contains('open') && !dragging;
document.addEventListener('visibilitychange', () => { if (idle()) load(); });
setInterval(() => { if (idle() && S && S.setup_done) load(); }, 30000);

load();
</script>
</body>
</html>
